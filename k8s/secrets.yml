# IMPORTANT: Never commit real credentials.
# Generate a strong JWT secret: openssl rand -base64 48
# Set values in your CI/CD environment or a Kubernetes Secret manager (e.g. Sealed Secrets, Vault).
apiVersion: v1
kind: Secret
metadata:
  name: chat-secrets
type: Opaque
stringData:
  jwt-secret: CHANGEME_use_openssl_rand_base64_48
  db-password: CHANGEME_strong_password